packages:
  - 'clients/typescript'
  - 'apps/web'
  - 'examples/typescript/*'

allowBuilds:
  bufferutil: false
  esbuild: true
  unrs-resolver: true
  utf-8-validate: false

auditConfig:
  ignoreGhsas:
    - GHSA-gcqx-w48m-w2h4

minimumReleaseAgeExclude:
  - minimatch@11.0.1
  - glob@14.0.2

overrides:
  glob@>=9.0.0 <=14.0.1: ^14.0.2
  minimatch@<11.0.1: ^11.0.1
