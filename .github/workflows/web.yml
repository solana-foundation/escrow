name: Web

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'apps/web/**'
      - 'pnpm-lock.yaml'
      - '.nvmrc'
      - '.github/workflows/web.yml'

jobs:
  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install
      - name: Build web app
        run: pnpm --filter @solana/escrow-program-web build
