[package]
name = "escrow"
version = "0.0.1"
edition = "2021"
description = "Rust client for the Escrow Solana program"
license = "MIT"
repository = "https://github.com/solana-foundation/escrow"
readme = "../../README.md"
include = ["Cargo.toml", "../../README.md", "src/**/*.rs"]

[dependencies]
borsh = { workspace = true, features = ["derive"] }
solana-account-info = "3.1.1"
solana-pubkey = "4.2.0"
solana-address = { version = "2.6.0", features = ["borsh", "copy", "curve25519", "decode"] }
solana-instruction = { version = "3.1.0", features = ["borsh"] }
solana-cpi = "3.0.1"
num-derive = { workspace = true }
num-traits = { workspace = true }

solana-rpc-client = { version = "3.1.5", optional = true }
solana-account = { version = "~3.4", optional = true }
solana-program-error = "3.0.1"
thiserror = { workspace = true }

[features]
default = []
fetch = ["solana-rpc-client", "solana-account"]

[package.metadata.cargo-machete]
ignored = ["num-traits"]
